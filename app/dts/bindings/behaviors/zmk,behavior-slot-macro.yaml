# AuroraKey runtime-mutable macro slot. Behaves like
# zmk,behavior-macro at use-site but its bindings live in writable
# RAM and are populated over the studio RPC channel
# (zmk.behaviors.set_macro_slot). Reference from a keymap as
# `&slot_macro N` where N selects which slot to fire (0..SLOT_COUNT-1).
